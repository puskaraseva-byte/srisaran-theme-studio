<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | SRI SARAN DIGITAL</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06142b;color:#f8fbff;font:15px system-ui,Arial}header{background:#0c2241;border-bottom:1px solid #294769;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0;color:#f7c766}main{max-width:1150px;margin:25px auto;padding:0 18px}.panel{background:#102849;border:1px solid #2a4a70;border-radius:14px;padding:23px;margin:15px 0}h2{margin:0 0 15px;font-size:20px}label{display:block;font-size:13px;margin:12px 0 5px;color:#d0def0}input,textarea,select{width:100%;border:1px solid #42628a;border-radius:9px;background:#081c36;color:white;padding:12px;font:inherit}textarea{min-height:80px}button,.btn{background:#f7c766;color:#06142b;font-weight:800;border:0;border-radius:9px;padding:11px 17px;cursor:pointer}button.secondary{background:#233f63;color:white;border:1px solid #527098}button.danger{background:#a22e3a;color:white}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex:0 0 auto}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.wide{grid-column:1/-1}.hidden{display:none!important}.product{padding:15px;border:1px solid #315274;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#b4c9e0}.notice{color:#f8d88b;font-size:13px}.status{min-height:22px;color:#f7c766}@media(max-width:650px){.cols{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style></head><body><header><h1>✦ SRI SARAN DIGITAL — Admin</h1><div class="row"><a href="/" style="color:#f7c766">← Marketplace</a><button id="logout" class="secondary hidden">Log out</button></div></header><main><section class="panel" id="loginPanel"><h2>Admin sign in</h2><p class="muted">Only the authorized administrator can manage products.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form></section><section id="workspace" class="hidden"><div class="panel"><h2 id="formHeading">Add a product</h2><form id="productForm"><div class="cols"><div><label>Product name *</label><input name="name" maxlength="120" required></div><div><label>Category *</label><select name="category"><option value="web">Web Themes</option><option value="app">App Themes</option><option value="tech">TechForge</option></select></div><div><label>Type</label><input name="type" placeholder="Education / Robotics"></div><div><label>Price in ₹ (0 for free)</label><input name="price" type="number" min="0" max="10000000" step="1" value="0" required></div><div><label>Technology / stack</label><input name="stack" placeholder="HTML · CSS · JS"></div><div><label>Icon emoji</label><input name="icon" value="📦"></div><div class="wide"><label>Image HTTPS URL (optional)</label><input name="image" type="url" placeholder="https://example.com/image.jpg"></div><div class="wide"><label>Description</label><textarea name="description"></textarea></div><div><label>Features (one per line)</label><textarea name="features"></textarea></div><div><label>Components (one per line)</label><textarea name="components"></textarea></div><div class="wide"><label><input name="published" type="checkbox" style="width:auto" checked> Publish on marketplace</label></div></div><div class="row"><button id="saveBtn">Save product</button><button class="secondary" id="cancelEdit" type="button">Clear / cancel editing</button></div></form></div><div class="panel"><div class="row" style="justify-content:space-between"><h2>Manage products</h2><button class="secondary" id="refresh">Refresh</button></div><p class="muted" id="count"></p><div id="productList"></div></div></section><p class="status" id="message" role="status"></p><p class="notice">Security: use a long unique admin password. This starter uses password sessions, not team accounts, payment processing or file uploads.</p></main><script>
const $=id=>document.getElementById(id);let editing=null,items=[];const msg=t=>$('message').textContent=t;async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}function visible(yes){$('loginPanel').classList.toggle('hidden',yes);$('workspace').classList.toggle('hidden',!yes);$('logout').classList.toggle('hidden',!yes)}async function load(){const d=await api('/api/admin/products');items=d.products;$('count').textContent=`${items.length} saved products (${items.filter(p=>p.published).length} published)`;const root=$('productList');root.replaceChildren();for(const p of items){const card=document.createElement('div');card.className='product';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=p.name;const details=document.createElement('div');details.className='muted';details.textContent=`${p.category.toUpperCase()} · ₹${p.price} · ${p.published?'Published':'Draft'}`;info.append(title,details);const actions=document.createElement('div');actions.className='row';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>editProduct(p);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>removeProduct(p);actions.append(edit,del);card.append(info,actions);root.append(card)}}function clear(){editing=null;$('formHeading').textContent='Add a product';$('productForm').reset();$('productForm').elements.price.value=0;$('productForm').elements.icon.value='📦'}function editProduct(p){editing=p.id;$('formHeading').textContent='Edit: '+p.name;const f=$('productForm').elements;for(const k of ['name','category','type','price','stack','icon','image','description'])f[k].value=p[k]??'';f.features.value=p.features.join('\n');f.components.value=p.components.join('\n');f.published.checked=p.published;window.scrollTo({top:0,behavior:'smooth'})}async function removeProduct(p){if(!confirm('Permanently delete '+p.name+'?'))return;try{await api('/api/admin/products/'+p.id,{method:'DELETE',body:'{}'});msg('Deleted '+p.name);await load()}catch(e){msg(e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';visible(true);await load();msg('Signed in')}catch(e){msg(e.message)}};$('productForm').onsubmit=async e=>{e.preventDefault();const f=e.target.elements;const product={name:f.name.value,category:f.category.value,type:f.type.value,price:Number(f.price.value),stack:f.stack.value,icon:f.icon.value,image:f.image.value,description:f.description.value,features:f.features.value.split('\n').map(x=>x.trim()).filter(Boolean),components:f.components.value.split('\n').map(x=>x.trim()).filter(Boolean),published:f.published.checked};try{await api(editing?'/api/admin/products/'+editing:'/api/admin/products',{method:editing?'PUT':'POST',body:JSON.stringify(product)});clear();await load();msg('Product saved successfully')}catch(e){msg(e.message)}};$('cancelEdit').onclick=clear;$('refresh').onclick=()=>load().catch(e=>msg(e.message));$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});visible(false);msg('Signed out')};api('/api/admin/session').then(d=>{visible(d.authenticated);if(d.authenticated)return load()}).catch(e=>msg(e.message));
</script></body></html>
